[project]
name = "lazycontroller"
version = "0.1.0"
description = "Drop-in wrapper for the OpenAI SDK that tries a fast model first and calls the slow model only when confidence is low."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.44,<4",
    "typesafe-sdk>=0.7.5,<0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
docs = [
    "mkdocs-jupyter>=0.27.0",
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8",
]
