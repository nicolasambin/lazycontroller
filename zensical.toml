[project]
site_name = "lazycontroller"
site_description = "A drop-in openai client: a fast decision model answers the structured-output calls it is sure of, and your LLM handles the rest."
site_url = "https://nicolasambin.github.io/lazycontroller/"
repo_url = "https://github.com/nicolasambin/lazycontroller"
repo_name = "nicolasambin/lazycontroller"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "Configuration" = "configuration.md" },
    { "Schemas and requests" = "schemas.md" },
    { "Routing and monitoring" = "routing.md" },
  ] },
  { "Example: bank transactions" = "examples/transactions.md" },
  { "API reference" = "reference.md" },
  { "Security" = "security.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

# The API reference is generated from the docstrings.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = false
members_order = "source"
docstring_style = "sphinx"
merge_init_into_class = true

[project.markdown_extensions]
admonition = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
# docs/index.md and docs/security.md include README.md and SECURITY.md from the repo root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
