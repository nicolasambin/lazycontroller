version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # lazycontroller relies on openai's private parsing helpers, so a new major version
      # needs checking by hand before the pin in pyproject.toml moves.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      # 0.x: a minor release of typesafe-sdk may break its API.
      - dependency-name: "typesafe-sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
