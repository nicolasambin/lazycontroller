site_name: lazycontroller
site_description: >-
  A drop-in openai client: a fast decision model answers the structured-output calls it is
  sure of, and your LLM handles the rest.
site_url: https://nicolasambin.github.io/lazycontroller/
repo_url: https://github.com/nicolasambin/lazycontroller
repo_name: nicolasambin/lazycontroller
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - search.highlight

nav:
  - Home: index.md
  - Guides:
      - Configuration: configuration.md
      - Schemas and requests: schemas.md
      - Routing and thresholds: routing.md
  - "Example: bank transactions": examples/transactions.md
  - API reference: reference.md
  - Security: security.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: sphinx
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    not_found: warn
    anchors: warn
